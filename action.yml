name: CutoffGuard manifest audit
description: Run CutoffGuard against a declared temporal run manifest and save SARIF/JUnit reports.
inputs:
  manifest:
    description: Path to a run-manifest JSON file.
    required: true
  output-directory:
    description: Directory for generated reports.
    required: false
    default: cutoffguard-reports
outputs:
  sarif-path:
    description: Path to the generated SARIF report.
    value: ${{ steps.audit.outputs.sarif-path }}
  junit-path:
    description: Path to the generated JUnit XML report.
    value: ${{ steps.audit.outputs.junit-path }}
  exit-code:
    description: CutoffGuard exit code from the audited manifest.
    value: ${{ steps.audit.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Install CutoffGuard from this repository
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --no-deps "$ACTION_PATH"
    - name: Write SARIF and JUnit reports
      id: audit
      shell: bash
      env:
        MANIFEST_PATH: ${{ inputs.manifest }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        set +e
        mkdir -p "$OUTPUT_DIRECTORY"
        sarif_path="$OUTPUT_DIRECTORY/cutoffguard.sarif"
        junit_path="$OUTPUT_DIRECTORY/cutoffguard.xml"
        python -m cutoffguard.cli audit-manifest "$MANIFEST_PATH" --format sarif --output "$sarif_path"
        sarif_code=$?
        python -m cutoffguard.cli audit-manifest "$MANIFEST_PATH" --format junit --output "$junit_path"
        junit_code=$?
        code=$sarif_code
        if [ "$junit_code" -gt "$code" ]; then code=$junit_code; fi
        if [ ! -s "$sarif_path" ] || [ ! -s "$junit_path" ]; then
          echo "CutoffGuard did not produce both report files" >&2
          if [ "$code" -lt 4 ]; then code=4; fi
        fi
        printf 'sarif-path=%s\n' "$sarif_path" >> "$GITHUB_OUTPUT"
        printf 'junit-path=%s\n' "$junit_path" >> "$GITHUB_OUTPUT"
        printf 'exit-code=%s\n' "$code" >> "$GITHUB_OUTPUT"
        exit "$code"
