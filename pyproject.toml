[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutoffguard"
version = "0.1.0"
description = "Cutoff-aware leakage diagnostics for temporal ML and research pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jiawei (Philip) Li"}]
keywords = ["time-series", "leakage", "reproducibility", "model-validation", "temporal-ml"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5", "ruff>=0.8", "mypy>=1.10"]

[project.scripts]
cutoffguard = "cutoffguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
